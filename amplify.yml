# Amplify Hosting build spec (Gen 2).
# The backend phase deploys amplify/ with CDK and writes amplify_outputs.json,
# which the frontend build then reads. The site is a static export in out/.
version: 1
backend:
  phases:
    build:
      commands:
        # shadcn's cn package (and Next 16) need Node 22+.
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
