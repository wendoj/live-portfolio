<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgb(130, 116, 241)"/>
      <stop offset="100%" stop-color="rgb(99, 102, 241)"/>
    </linearGradient>
  </defs>

  <!-- rounded gradient background -->
  <rect width="160" height="160" rx="32" fill="url(#bgGradient)"/>

  <!-- icon group (optically centered) -->
  <g id="icon" transform="translate(0 -4)" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- headphones band -->
    <path d="M44 78c0-22 16-38 36-38s36 16 36 38"/>

    <!-- ear pads -->
    <rect x="32" y="78" width="18" height="40" rx="9"/>
    <rect x="110" y="78" width="18" height="40" rx="9"/>

    <!-- timer circle -->
    <circle cx="80" cy="98" r="30"/>

    <!-- hands -->
    <path d="M80 98V82"/>
    <path d="M80 98l14 10"/>
  </g>
</svg>